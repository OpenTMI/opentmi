name: OpenTMI CI

on:
  push:
    branches:
      - master
  pull_request:
     paths-ignore:
      - '**/*.md'
      - '.github/workflows/docker.yml'
env:
  CHROME_BIN: "/usr/bin/google-chrome"
  NODE_ENV: test

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install MongoDB Shell
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg curl
        curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
        echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
        sudo apt-get update
        sudo apt-get install -y mongodb-mongosh
    - name: install dependencies
      run: npm ci
    - name: run unit tests
      run: npm run test-unit-ci
    - name: coveralls
      run: cat ./coverage/lcov.info | ./node_modules/coveralls/bin/coveralls.js
    - name: Create mongoDB Docker container
      run: sudo docker run -d -p 27017:27017 mongo:4.4.10-focal
    - name: api tests
      run: |
        MOCHA_FILE=junit/apitests.xml NODE_OPTIONS=--trace-warnings grunt apitests
    - name: cluster tests
      run: |
        MOCHA_FILE=junit/clustertests.xml grunt clustertests --silent
    - name: lint
      run: |
        npm run lint
    - uses: actions/upload-artifact@v4
      if: success() || failure()    # run this step even if previous step failed
      with:
        # Artifact name
        name: logs-${{ matrix.node-version }}
        path: log/*
    - uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: coverage-report-${{ matrix.node-version }}
        path: coverage/lcov-report/**
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()    # run this step even if previous step failed
      with:
        # Name of the check run which will be created
        name: Unit Test report ${{ matrix.node-version }}
        path: report_unit.json
        reporter: mocha-json
